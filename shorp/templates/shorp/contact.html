{% extends 'shorp/base.html' %}
{% block title %}Contact — Remise{% endblock %}
{% block nav_contact %}active{% endblock %}

{% block content %}
  <div class="list-header">
    <a href="{% url 'shorp:home' %}" class="back-btn">&#8592;</a>
    <h1>Contact Us</h1>
    <span></span>
  </div>

  <div class="form-page">
    <p style="font-size:13.5px;color:#5c5c5c;margin-bottom:18px;">
      Questions about an order or a product? Send us a message and we'll
      reply within one business day.
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="c-name">Your name</label>
        <input type="text" id="c-name" name="name" required>
      </div>
      <div class="field">
        <label for="c-email">Email address</label>
        <input type="email" id="c-email" name="email" required>
      </div>
      <div class="field">
        <label for="c-message">Message</label>
        <textarea id="c-message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Send Message</button>
    </form>
  </div>
{% endblock %}
